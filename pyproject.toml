[project]
name = "payments"
version = "0.1.0"
description = "Async payment processing service: FastAPI, PostgreSQL, RabbitMQ"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg",
    "alembic",
    "faststream[rabbit]>=0.7",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "testcontainers[postgres,rabbitmq]",
    "asgi-lifespan",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--strict-markers -q"

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
